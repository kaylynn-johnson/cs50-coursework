<!DOCTYPE html>
<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
        <title>Image Search</title>
    </head>
    <body style="font-family: Google Sans;">
        <div style="text-align: end;">
            <a href="index.html" style="text-decoration: none; color: black;">Search</a>
        </div>
        <div style="text-align: center; font-size: 50px; margin-top: 100px; margin-bottom: 20px">
            GOOGLE IMAGES
        </div>
        <div style="text-align: center;">
            <form action="https://www.google.com/search">
                <div>
                    <input type="text" name="q" style="height: 35px; width: 500px; border-radius: 20px; margin: 10px">
                    <input type="hidden" name="tbm" value="isch">
                </div>
                <div>
                    <input type="submit" value="Google Image Search" style="border: none; font-size: 16px;">
                </div>
            </form>
        </div>
    </body>
</html>
