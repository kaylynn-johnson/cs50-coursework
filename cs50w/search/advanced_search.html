<!DOCTYPE html>
<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <title>Advanced Search</title>
    </head>
    <body class="google-font">
        <div id="advanced-header">
            <div id="advanced-google">
                <img src="google_logo_small.svg" alt="Small Google Logo" width="100" height="50">
            </div>
            <div id="advanced-nav">
                <a href="index.html" class="plain-link">Search</a>
            </div>
        </div>
        <div class="left-align">
            <div id="advanced-search-text">Advanced Search</div>
            <div id="advanced-find-pages">Find pages with</div>
            <form action="https://www.google.com/search">
                <div id="advanced-search-fields">
                    <div>All these words:</div>
                    <div>
                        <input type="text" autofocus autocomplete="off" name="as_q" class="advanced-search-bar">
                    </div>
                    <div>This exact word or phrase:</div>
                    <div>
                        <input type="text" autocomplete="off" name="as_epq" class="advanced-search-bar">
                    </div>
                    <div>Any of these words:</div>
                    <div>
                        <input type="text" autocomplete="off" name="as_oq" class="advanced-search-bar">
                    </div>
                    <div>None of these words:</div>
                    <div>
                        <input type="text" autocomplete="off" name="as_eq" class="advanced-search-bar">
                    </div>
                </div>
                <div id="advanced-submit-box">
                    <input type="submit" value="Advanced Search" id="advanced-submit-btn">
                </div>
            </form>
        </div>
    </body>
</html>
