{% extends 'encyclopedia/layout.html' %}

{% block title %}
    Editing {{ title }}
{% endblock %}

{% block body %}
    <h1>Edit {{ title }}</h1>

    <form action="{% url 'publish' %}" method="post">
        {% csrf_token %}
        <div><input type="hidden" name="title" value="{{ title }}"></div>
        <div><textarea name="markdown_contents">{{ markdown_contents }}</textarea></div>
        <input type="hidden" name="action" value="edit">
        <div><input type="submit" value="Save"></div>
    </form>

{% endblock %}
