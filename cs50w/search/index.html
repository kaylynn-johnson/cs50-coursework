<!DOCTYPE html>
<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <title>Search</title>
    </head>
    <body class="google-font">
        <div id="main-nav">
            <div></div>
            <div class="align-end">
                <a href="image_search.html" class="plain-link">Image Search</a>
            </div>
            <div class="align-end">
                <a href="advanced_search.html" class="plain-link">Advanced Search</a>
            </div>
        </div>
        <div class="google-logo">
            <img src="google-logo-large.png" alt="Large Google Logo" width="400" height="150">
        </div>
        <div class="center-align">
            <form action="https://www.google.com/search">
                <div>
                    <input type="text" autofocus autocomplete="off" name="q" class="search-bar">
                </div>
                <div>
                    <input type="submit" value="Google Search" class="submit-search">
                    <input type="submit" name="btnI" value="I'm Feeling Lucky" class="submit-search">
                </div>
            </form>
        </div>
    </body>
</html>
