{% extends 'encyclopedia/layout.html' %}

{% block title %}
    {{ title }}
{% endblock %}

{% block body %}
    <div>
        <form action="{% url 'edit' %}" method="post">
            {% csrf_token %}
            <input type="hidden" name="entry" value="{{ title }}">
            <input type="submit" value="Edit Page">
        </form>
    </div>
    {{ html_content|safe }}
{% endblock %}
